<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zambal Lingua Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4e54c8;
            --secondary: #8f94fb;
            --success: #00b894;
            --danger: #d63031;
            --light: #f1f2f6;
            --dark: #2d3436;
            --white: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: all 0.3s ease; }

        body {
            margin: 0;
            background: var(--light);
            color: var(--dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 40px 20px;
            color: white;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        /* CONTENT AREA */
        .content { padding: 20px; flex: 1; }

        /* MENU BUTTONS */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        
        .nav-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .nav-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .nav-card i { font-size: 40px; display: block; margin-bottom: 10px; }
        .nav-card h3 { margin: 0; color: var(--primary); }

        /* DICTIONARY UI */
        .search-box {
            position: sticky;
            top: 10px;
            background: white;
            padding: 10px 0;
            z-index: 10;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            background: #f9f9f9;
        }

        input:focus { border-color: var(--primary); background: white; }

        .word-card {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            border-left: 5px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .zambal-text { color: var(--primary); font-weight: 700; font-size: 18px; display: block; }
        .trans-text { font-size: 14px; color: #636e72; margin-top: 5px; }

        /* QUIZ UI */
        .quiz-container { text-align: center; padding: 20px 0; }
        .question-box {
            background: #f1f2f6;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-back { background: none; color: #b2bec3; font-size: 14px; margin-top: 20px; border: none; cursor: pointer; }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
        }

        .hidden { display: none; }

        /* ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade { animation: fadeIn 0.4s ease forwards; }

    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1 id="screen-title">Zambal Lingua Pro</h1>
        <p id="screen-sub">Learn Tina Sambal Everyday</p>
    </div>

    <div class="content">
        
        <div id="menu-screen" class="fade">
            <div class="menu-grid">
                <div class="nav-card" onclick="showScreen('dict')">
                    <i>📖</i>
                    <h3>Dictionary</h3>
                    <small>Search 1,000+ Words</small>
                </div>
                <div class="nav-card" onclick="showScreen('quiz')">
                    <i>🎮</i>
                    <h3>Quiz Game</h3>
                    <small>Test your knowledge</small>
                </div>
            </div>
            <p style="text-align: center; color: #999; margin-top: 30px; font-size: 12px;">Version 2.0 • Created for Zambal Learner</p>
        </div>

        <div id="dict-screen" class="hidden fade">
            <div class="search-box">
                <input type="text" id="searchBar" placeholder="Search Tagalog, English, or Zambal..." onkeyup="runSearch()">
            </div>
            <div id="wordList" style="margin-top: 10px;"></div>
            <button class="btn-back" onclick="showScreen('menu')">← Back to Menu</button>
        </div>

        <div id="quiz-screen" class="hidden fade">
            <div class="quiz-container">
                <div class="question-box">
                    <small style="color: var(--primary); display: block; margin-bottom: 10px;">Translate to Zambal</small>
                    <span id="q-word">...</span>
                </div>
                <input type="text" id="quizInput" placeholder="Type your answer here...">
                <button class="btn-main" onclick="checkQuiz()">Check Answer</button>
                <div id="feedbackBox" class="feedback"></div>
                <button id="nextBtn" class="btn-main hidden" style="background: var(--success);" onclick="loadQuestion()">Next Question</button>
                <button class="btn-back" onclick="showScreen('menu')">End Quiz</button>
            </div>
        </div>

    </div>
</div>

<script>
    // DATASET (DITO MO DAGDAGAN ANG MGA WORDS)
    const database = [
        {z: "Maabig a abak", t: "Magandang umaga", e: "Good morning"},
        {z: "Maabig a yabi", t: "Magandang gabi", e: "Good evening"},
        {z: "Ranom", t: "Tubig", e: "Water"},
        {z: "Mangan", t: "Kain", e: "Eat"},
        {z: "Malinggas", t: "Maganda", e: "Beautiful"},
        {z: "Masanting", t: "Gwapo", e: "Handsome"},
        {z: "Abay", t: "Bahay", e: "House"},
        {z: "Kaluguran", t: "Kaibigan", e: "Friend"},
        {z: "Salamat", t: "Salamat", e: "Thank you"},
        {z: "Hahay ka?", t: "Kumusta ka?", e: "How are you?"},
        {z: "Melat", t: "Kanin", e: "Cooked Rice"},
        {z: "Laman", t: "Ulam", e: "Viand"},
        {z: "Misa", t: "Isa", e: "One"},
        {z: "Rwa", t: "Dalawa", e: "Two"},
        {z: "Tlo", t: "Tatlo", e: "Three"},
        {z: "Apat", t: "Apat", e: "Four"},
        {z: "Lima", t: "Lima", e: "Five"}
    ];

    let currentQ = {};

    function showScreen(screen) {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('dict-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.add('hidden');

        if(screen === 'menu') {
            document.getElementById('menu-screen').classList.remove('hidden');
            updateHeader("Zambal Lingua Pro", "Learn Tina Sambal Everyday");
        } else if(screen === 'dict') {
            document.getElementById('dict-screen').classList.remove('hidden');
            updateHeader("Dictionary", "Fast Search Dictionary");
            runSearch();
        } else if(screen === 'quiz') {
            document.getElementById('quiz-screen').classList.remove('hidden');
            updateHeader("Quiz Mode", "Challenge Yourself");
            loadQuestion();
        }
    }

    function updateHeader(title, sub) {
        document.getElementById('screen-title').innerText = title;
        document.getElementById('screen-sub').innerText = sub;
    }

    // SEARCH LOGIC
    function runSearch() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const list = document.getElementById('wordList');
        list.innerHTML = "";

        const filtered = database.filter(w => 
            w.z.toLowerCase().includes(query) || 
            w.t.toLowerCase().includes(query) || 
            w.e.toLowerCase().includes(query)
        );

        filtered.forEach(item => {
            list.innerHTML += `
                <div class="word-card fade">
                    <span class="zambal-text">${item.z}</span>
                    <div class="trans-text">Tagalog: ${item.t} | English: ${item.e}</div>
                </div>
            `;
        });
    }

    // QUIZ LOGIC
    function loadQuestion() {
        currentQ = database[Math.floor(Math.random() * database.length)];
        document.getElementById('q-word').innerText = currentQ.t;
        document.getElementById('quizInput').value = "";
        document.getElementById('feedbackBox').style.display = "none";
        document.getElementById('nextBtn').classList.add('hidden');
    }

    function checkQuiz() {
        const userAns = document.getElementById('quizInput').value.trim().toLowerCase();
        const box = document.getElementById('feedbackBox');
        box.style.display = "block";

        if(userAns === currentQ.z.toLowerCase()) {
            box.innerText = "Excellent! Correct Answer.";
            box.style.background = "#d4edda";
            box.style.color = "#155724";
            document.getElementById('nextBtn').classList.remove('hidden');
        } else {
            box.innerText = "Oops! The correct word is: " + currentQ.z;
            box.style.background = "#f8d7da";
            box.style.color = "#721c24";
            document.getElementById('nextBtn').classList.remove('hidden');
        }
    }
</script>

</body>
</html>
